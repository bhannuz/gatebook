<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flat Payments Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
</head>
<body>

  <!-- Loading overlay — shown while Firebase loads data -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <div class="loading-text">Connecting to Firebase…</div>
    </div>
  </div>

  <div class="app-wrapper" id="appWrapper" style="display:none">

    <!-- ── Top Nav ── -->
    <nav class="navbar">
      <div class="nav-brand">
        <i class="ti ti-building" aria-hidden="true"></i>
        <span>Flat Payments Tracker</span>
      </div>
      <div class="nav-right">
        <!-- Real-time sync dot -->
        <div class="sync-indicator" id="syncIndicator" title="Firebase sync status">
          <span class="sync-dot" id="syncDot"></span>
          <span class="sync-label" id="syncLabel">Live</span>
        </div>
        <span class="nav-month" id="navMonth"></span>
        <button class="nav-btn secondary-btn" onclick="openAddFlatModal()" title="Register a new flat">
          <i class="ti ti-home-plus" aria-hidden="true"></i> New Flat
        </button>
        <button class="nav-btn" onclick="openAddExpense()">
          <i class="ti ti-plus" aria-hidden="true"></i> Add Expense
        </button>
      </div>
    </nav>

    <!-- ── Summary Bar ── -->
    <section class="summary-section" aria-label="Payment summary">
      <div class="summary-grid" id="summaryBar"></div>
    </section>

    <!-- ── Controls ── -->
    <section class="controls-section">
      <div class="controls-row">
        <select id="monthFilter" aria-label="Filter by month">
          <option value="2026-05">May 2026</option>
          <option value="2026-04">April 2026</option>
          <option value="2026-03">March 2026</option>
        </select>
        <select id="statusFilter" aria-label="Filter by status">
          <option value="all">All statuses</option>
          <option value="paid">Paid</option>
          <option value="partial">Partial</option>
          <option value="pending">Pending</option>
        </select>
        <div class="search-wrap">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input type="text" id="searchInput" placeholder="Search flat or owner…" aria-label="Search flat or owner" />
        </div>
      </div>
    </section>

    <!-- ── Block Tabs ── -->
    <div class="tab-bar" id="tabBar" role="tablist" aria-label="Blocks"></div>

    <!-- ── Block Content ── -->
    <main class="block-section" id="blockContent" aria-live="polite"></main>

  </div><!-- /.app-wrapper -->


  <!-- ══════════════════════════════════════
       FLAT DETAIL MODAL
  ══════════════════════════════════════ -->
  <div class="modal-bg" id="flatModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="modalTitle"></div>
          <div class="modal-sub"   id="modalSub"></div>
        </div>
        <button class="modal-close" onclick="window.__closeModal()" aria-label="Close dialog">
          <i class="ti ti-x"></i>
        </button>
      </div>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       ADD EXPENSE MODAL
  ══════════════════════════════════════ -->
  <div class="modal-bg" id="addModal" role="dialog" aria-modal="true" aria-label="Add expense form">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">Add Expense / Payment</div>
        <button class="modal-close" onclick="window.__closeAddModal()" aria-label="Close dialog">
          <i class="ti ti-x"></i>
        </button>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="fBlock">Block</label>
          <select id="fBlock"></select>
        </div>
        <div class="form-group">
          <label for="fFlat">Flat No.</label>
          <select id="fFlat"></select>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="fCat">Category</label>
          <select id="fCat">
            <option>Maintenance</option>
            <option>Water</option>
            <option>Electricity</option>
            <option>Parking</option>
            <option>Lift</option>
            <option>Security</option>
            <option>Cleaning</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="fAmt">Amount (₹)</label>
          <input type="number" id="fAmt" placeholder="0" min="1" />
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="fDate">Date</label>
          <input type="date" id="fDate" />
        </div>
        <div class="form-group">
          <label for="fStatus">Payment Status</label>
          <select id="fStatus">
            <option value="paid">Paid</option>
            <option value="partial">Partial</option>
            <option value="pending">Pending</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="fNote">Note (optional)</label>
        <input type="text" id="fNote" placeholder="e.g. advance paid, cheque received…" />
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" onclick="window.__closeAddModal()">Cancel</button>
        <button class="btn-primary" id="saveBtn" onclick="window.__saveExpense()">
          <i class="ti ti-device-floppy" aria-hidden="true"></i>
          <span id="saveBtnLabel">Save</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       ADD NEW FLAT MODAL
  ══════════════════════════════════════ -->
  <div class="modal-bg" id="addFlatModal" role="dialog" aria-modal="true" aria-label="Register new flat">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">Register New Flat</div>
        <button class="modal-close" onclick="window.__closeAddFlatModal()" aria-label="Close dialog">
          <i class="ti ti-x"></i>
        </button>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="nfBlock">Block</label>
          <select id="nfBlock">
            <option value="A">Block A</option>
            <option value="B">Block B</option>
            <option value="C">Block C</option>
          </select>
        </div>
        <div class="form-group">
          <label for="nfId">Flat No. (e.g. A-101)</label>
          <input type="text" id="nfId" placeholder="A-101" />
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label for="nfOwner">Owner Name</label>
          <input type="text" id="nfOwner" placeholder="Full name" />
        </div>
        <div class="form-group">
          <label for="nfDue">Monthly Due (₹)</label>
          <input type="number" id="nfDue" placeholder="5000" min="1" />
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn-secondary" onclick="window.__closeAddFlatModal()">Cancel</button>
        <button class="btn-primary" onclick="window.__saveNewFlat()">
          <i class="ti ti-plus" aria-hidden="true"></i> Register Flat
        </button>
      </div>
    </div>
  </div>

  <!-- app.js MUST be type="module" so Firebase ESM imports work -->
  <script type="module" src="app.js"></script>

</body>
</html>
